# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Architectury Loom 1.13 depends on net.fabricmc.unpick:unpick 3.x, which refuses
# to run on a JVM older than 21, and Gradle 8.x cannot itself run on JDK 24+
# ("Unsupported class file major version 69"). Gradle 9.x is the version that
# satisfies both, and gradle/gradle-daemon-jvm.properties pins the daemon to
# Java 25. Java 17 is still the *compile* target, because that is what
# Minecraft 1.20.1 requires -- see the toolchain in build.gradle.
# (\uXXXX escapes: java.util.Properties reads this file as ISO-8859-1.)
org.gradle.java.installations.paths=D:/\u5DE5\u5177/jdk-17.0.20.1+1

# ---------------------------------------------------------------------------
# Mod
# ---------------------------------------------------------------------------
mod_version = 0.4.5
maven_group = com.qisheng.chess
archives_name = qisheng_chess
enabled_platforms = fabric

# ---------------------------------------------------------------------------
# Minecraft
# ---------------------------------------------------------------------------
minecraft_version = 1.20.1
supported_version = 1.20.1

# ---------------------------------------------------------------------------
# Architectury
# ---------------------------------------------------------------------------
architectury_api_version = 9.2.14

# ---------------------------------------------------------------------------
# Fabric
# ---------------------------------------------------------------------------
fabric_loader_version = 0.14.21
fabric_api_version = 0.92.1+1.20.1
