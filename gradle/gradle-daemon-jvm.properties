# Pins the Gradle *daemon* JVM (the JVM that runs Gradle itself).
#
# Two separate Java requirements live in this project:
#
#   1. The daemon JVM -- must be Java 21 or newer, because Architectury Loom
#      1.7.435 drags in `net.fabricmc.unpick:unpick` 3.x, which refuses to run
#      on an older runtime ("Dependency requires at least JVM runtime version 21").
#   2. The *compile* toolchain -- Java 17, the language level Minecraft 1.20.1
#      is built against. It is declared in build.gradle (`java.toolchain`) and
#      resolved from `org.gradle.java.installations.paths` in gradle.properties.
#
# The local JDK 17 is only used for (2). If Gradle itself ran on 17 the build
# would fail at (1), so the daemon is pinned separately here.
toolchainVersion=25
